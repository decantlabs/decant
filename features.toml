# Feature map of Decant, a generic layer that runs Xbox Series titles built with the GDK natively on a PC.
#
# The proofs name milestones of a title profile that lives on tester machines. The profile id is `title`.
# The scenarios are `boot` (start the title and run to its first screens) and `menu` (get past a menu with
# scripted pad input). A milestone is named by what a run log shows. The milestone ids used in this file:
#   process_started, title_config_read, memory_allocated, device_created, swapchain_created,
#   first_present, direct_shaders_compiled, shader_cache_hit, textures_detiled, storage_backend_ready,
#   audio_voice_started, pad_input_seen, user_signed_in, save_provider_opened, trace_written
#
# The status of a feature is not written here. The hub derives it from the matrix cells of its proofs.

version = 1

[[area]]
id = "launch"
title = "Launch and loading"

[[area]]
id = "memory"
title = "Memory"

[[area]]
id = "graphics"
title = "Graphics device and command lists"

[[area]]
id = "present"
title = "Presentation"

[[area]]
id = "shaders"
title = "Shader translation"

[[area]]
id = "textures"
title = "Textures"

[[area]]
id = "storage"
title = "Storage and file I/O"

[[area]]
id = "audio"
title = "Audio"

[[area]]
id = "input"
title = "Input"

[[area]]
id = "system"
title = "System services of the GDK"

[[area]]
id = "diagnostics"
title = "Diagnostics and tooling"

# ---------------------------------------------------------------- launch

[[feature]]
id = "launch.config_read"
title = "The title configuration and executable headers are read"
area = "launch"
paths = ["crates/decant-gdk-config/**"]
how = "Run gdk_config_reader on a staged title folder. Unit tests of the crate cover the parsing."

[[feature.proof]]
profile = "title"
scenario = "boot"
milestone = "title_config_read"

[[feature]]
id = "launch.import_audit"
title = "Missing imports are found before the title starts"
area = "launch"
paths = ["crates/decant-audit-imports/**"]
how = "Run audit_xbox_imports on a staged title. The crate unit tests prove the report."

[[feature]]
id = "launch.stand_ins"
title = "Stand in libraries answer for console modules nothing provides"
area = "launch"
paths = ["crates/decant-stub/**"]
depends = ["launch.import_audit"]
how = "Run decant_stubgen on an audit report. The tests of decant-stub prove the generated projects."

[[feature]]
id = "launch.stage"
title = "A title package is staged with the Decant libraries first"
area = "launch"
paths = ["crates/decant-launch/src/stage.rs", "crates/decant-launch/src/relaunch.rs"]
depends = ["launch.config_read"]
how = "Start decant-launch on a title folder and look at the overlay folder it makes."

[[feature]]
id = "launch.run"
title = "The title runs under the launcher and every library load is logged"
area = "launch"
paths = [
  "crates/decant-launch/src/main.rs",
  "crates/decant-launch/src/run.rs",
  "crates/decant-launch/src/runtime.rs",
  "crates/decant-launch/src/lib.rs",
  "crates/decant-launch/tests/**",
]
depends = ["launch.stage"]
how = "Start decant-launch on a staged title and read the launcher log."

[[feature.proof]]
profile = "title"
scenario = "boot"
milestone = "process_started"

[[feature]]
id = "launch.hang_reports"
title = "A thread that waits too long is reported with its stack"
area = "launch"
paths = ["crates/decant-launch/src/tools/**", "crates/decant-launch/src/sampler.rs"]
depends = ["launch.run"]
how = "Set DECANT_WAITS to a number of seconds and read decant_waits.txt next to the title."

[[feature]]
id = "launch.shader_precompile"
title = "Shaders are translated ahead of time while the title loads"
area = "launch"
paths = ["crates/decant-launch/src/precompile.rs"]
depends = ["launch.run", "shaders.cache"]
how = "Start decant-launch with the precompile switch and read the precompile lines of the log."

[[feature]]
id = "launch.linux"
title = "A title is prepared and launched under Wine and Proton"
area = "launch"
paths = ["crates/decant-linux/**", "src/gdk/**", "sandbox/**"]
how = "Run launch_prep on Linux as src/gdk/README.md says. Unit tests of decant-linux prove the planning."

