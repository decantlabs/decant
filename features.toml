paths = ["crates/decant-trace/**"]
depends = ["diagnostics.log"]
how = "Set DECANT_TRACE, run a title and open the Perfetto file or run decant_trace_summary."

[[feature.proof]]
profile = "title"
scenario = "boot"
milestone = "trace_written"

[[feature]]
