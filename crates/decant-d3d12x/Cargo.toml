[package]
name = "decant-d3d12x"
description = "d3d12_xs.dll, the Scarlett D3D12.X layer over a PC D3D12 runtime (root signature helpers, console ABI proxies, frame events), with its test d3d12xs_test. Rust port of the former src/gdk/d3d12_xs.c and its companions."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "d3d12_xs"
# rlib so that cargo builds the DLL before the integration tests, which load it, and so that the
# test program can use the container helpers.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "d3d12xs_test"
path = "src/bin/d3d12xs_test.rs"

[[bin]]
name = "decant_shader_warm"
path = "src/bin/decant_shader_warm.rs"

[[bench]]
name = "draws"
harness = false

[dependencies]
decant-texture.workspace = true
decant-log = { path = "../decant-log" }
decant-testkit = { path = "../decant-testkit" }
decant-shader.workspace = true
decant-dxc.workspace = true
decant-extract-shaders.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# DECANT_CAPTURE writes PNG files.
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# The D3D12 and DXGI types of the test program, which calls the PC interfaces through them.
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
