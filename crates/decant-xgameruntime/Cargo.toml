[package]
name = "decant-xgameruntime"
description = "xgameruntime.dll, the Decant interposer: logs what a title asks the game runtime and forwards every call to the PC runtime, with its test xgameruntime_test."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "xgameruntime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xgameruntime_test"
path = "src/bin/xgameruntime_test.rs"

[dependencies]
decant-gdk-config = { path = "../decant-gdk-config" }
decant-log = { path = "../decant-log" }
decant-testkit = { path = "../decant-testkit" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
