[package]
name = "decant-xmem"
description = "xmem.dll, the Decant console allocator (XMemAlloc, XMemFree and their companions) on Windows virtual memory, with the tests loadtest and xmem_abitest."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xmem"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "xmem_abitest"
path = "src/bin/xmem_abitest.rs"

[dependencies]
decant-log = { path = "../decant-log" }
decant-testkit = { path = "../decant-testkit" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[lints]
workspace = true
