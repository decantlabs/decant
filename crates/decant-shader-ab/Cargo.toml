[package]
name = "decant-shader-ab"
description = "GPU A/B comparison of two shaders: runs shader A and shader B (DXIL containers, or HLSL compiled with DXC) on a real D3D12 device with the same generated inputs and reports where their outputs differ."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "decant-shader-ab"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# `process::run`: a subprocess with a deadline, for one side per process in batch mode.
decant-shader-batch = { path = "../decant-shader-batch" }

[target.'cfg(windows)'.dependencies]
# `validate::validate_in_place`: signs a reassembled container with dxil.dll.
decant-dxil = { path = "../decant-dxil" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Dxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
