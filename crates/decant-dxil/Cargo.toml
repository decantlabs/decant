[package]
name = "decant-dxil"
description = "A DXIL writer without LLVM: turns a small scalar SSA IR into a signed DXBC container holding DXIL (LLVM 3.7 bitcode), for Shader Model 6.6 compute shaders. Clean room implementation of the specification dxil-writer-spec."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rspirv = "0.13"

[target.'cfg(windows)'.dependencies]
# Test helpers: the in place validator of dxil.dll and a real D3D12 device.
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Dxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com"] }

[lints]
workspace = true

[dev-dependencies]
# Only for the test that proves the copied digest equals the one of d3d12_xs::rts0.
decant-d3d12x = { path = "../decant-d3d12x" }
# The D3D12 device, buffers and submission the GPU tests share with the A/B runner.
decant-shader-ab = { path = "../decant-shader-ab" }
