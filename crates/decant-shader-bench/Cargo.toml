[package]
name = "decant-shader-bench"
description = "The DecantShader GPU test benches: decant_shader_run (Vulkan) and vkd3d_test (Direct3D 12 through vkd3d-proton)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "decant_shader_run"
path = "src/decant_shader_run/main.rs"

[[bin]]
name = "vkd3d_test"
path = "src/vkd3d_test/main.rs"

[dependencies]
ash = "0.38"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lints]
workspace = true
