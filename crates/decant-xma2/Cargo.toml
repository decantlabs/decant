[package]
name = "decant-xma2"
description = "decant_xma2.dll, an optional XMA2 decoder plugin for decant_xaudio2.dll that decodes with the pure Rust decant-xma, plus the xma2test program that runs it on a RIFF XMA2 file."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "decant_xma2"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xma2test"
path = "src/bin/xma2test.rs"

[dependencies]
decant-log = { path = "../decant-log" }
decant-xma = { path = "../decant-xma" }
decant-testkit = { path = "../decant-testkit" }

[dev-dependencies]
# Only to check the decoder table against the consumer's declaration: linked into the tests, never into the DLL.
decant-xaudio2 = { path = "../decant-xaudio2" }

[lints]
workspace = true
