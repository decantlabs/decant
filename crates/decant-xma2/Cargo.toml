[package]
name = "decant-xma2"
description = "decant_xma2.dll, the optional Decant XMA2 fallback decoder over a user supplied LGPL shared FFmpeg, loaded at run time. Rust port of the former src/decant/xaudio2/decant_xma2.c, with its test xma2test."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "decant_xma2"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xma2test"
path = "src/bin/xma2test.rs"

[dependencies]
decant-log = { path = "../decant-log" }
decant-testkit = { path = "../decant-testkit" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# Only to check the decoder table against the consumer's declaration: linked into the tests, never into the DLL.
decant-xaudio2 = { path = "../decant-xaudio2" }

[lints]
workspace = true
