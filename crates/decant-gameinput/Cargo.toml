[package]
name = "decant-gameinput"
description = "GameInput.dll, a Decant shim with one always connected gamepad driven by a control file (DECANT_PAD_SCRIPT), and the decant-pad tool that writes to that file."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "GameInput"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "decant-pad"
path = "src/bin/decant-pad.rs"

[dependencies]
decant-log = { path = "../decant-log" }
# Windows only in practice (gated with cfg(windows) in src/devices.rs): the real XInput pad and
# GetAsyncKeyState keyboard reads. Compiles as a no-op surface on other hosts, like the other
# crates here that use windows-sys unconditionally in Cargo.toml.
windows-sys = { version = "0.61", features = [
  "Win32_UI_Input_XboxController",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Foundation",
] }

[dev-dependencies]
decant-testkit = { path = "../decant-testkit" }
tempfile.workspace = true

[lints]
workspace = true
