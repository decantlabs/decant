[package]
name = "decant-linux"
description = "The Linux launch driver of the GDK host layer and the sandbox runners: launch_prep, run_airgapped and test_isolation, which drive curl, tar, minisign, make, Proton, Wine and docker."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "launch_prep"
path = "src/bin/launch_prep.rs"

[[bin]]
name = "run_airgapped"
path = "src/bin/run_airgapped.rs"

[[bin]]
name = "test_isolation"
path = "src/bin/test_isolation.rs"

[dependencies]
decant-gdk-config = { path = "../decant-gdk-config" }
sha2 = "0.11"
tempfile.workspace = true

[lints]
workspace = true
