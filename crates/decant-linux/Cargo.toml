[package]
name = "decant-linux"
description = "The Linux launch driver of the GDK host layer and the sandbox runners: the ports of src/gdk/launch_prep.sh, sandbox/run_airgapped.sh and sandbox/test_isolation.sh, with the same commands, environment variables, messages and exit codes."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "launch_prep"
path = "src/bin/launch_prep.rs"

[[bin]]
name = "run_airgapped"
path = "src/bin/run_airgapped.rs"

[[bin]]
name = "test_isolation"
path = "src/bin/test_isolation.rs"

[dependencies]
decant-gdk-config = { path = "../decant-gdk-config" }
sha2 = "0.11"
tempfile.workspace = true

[lints]
workspace = true
