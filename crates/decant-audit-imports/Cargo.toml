[package]
name = "decant-audit-imports"
description = "audit_xbox_imports lists the imports of a Xbox GDK build and what this PC can resolve, and d3d12x_vtprobe checks the virtual table layout of the D3D12.X layer."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "audit_xbox_imports"
path = "src/main.rs"

[[bin]]
name = "d3d12x_vtprobe"
path = "src/vtprobe_main.rs"

[dependencies]
# x86-64 decoder for d3d12x_vtprobe (MIT).
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }

serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug"] }

[lints]
workspace = true
